      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <circle cx="400" cy="300" r="240" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="6,6" />
  <circle cx="400" cy="300" r="160" fill="none" stroke="#3f3f46" stroke-width="1.5" />
  
  <!-- Central Server Node -->
  <rect x="340" y="240" width="120" height="120" rx="20" fill="#27272a" stroke="#71717a" stroke-width="2" />
  <rect x="360" y="270" width="80" height="12" rx="4" fill="#e4e4e7" />
