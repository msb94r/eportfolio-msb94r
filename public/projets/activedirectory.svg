  <rect x="360" y="320" width="80" height="12" rx="4" fill="#52525b" />
  <circle cx="430" cy="276" r="3" fill="#a1a1aa" />
  
  <!-- Outer Client Nodes -->
  <line x1="400" y1="240" x2="400" y2="140" stroke="#71717a" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="400" cy="140" r="32" fill="#27272a" stroke="#a1a1aa" stroke-width="2" />
  <text x="400" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f4f4f5" text-anchor="middle">GPO</text>
  
  <line x1="460" y1="300" x2="560" y2="300" stroke="#71717a" stroke-width="2" stroke-dasharray="4,4" />
