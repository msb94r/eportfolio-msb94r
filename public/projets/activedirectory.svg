  <text x="560" y="305" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f4f4f5" text-anchor="middle">DNS</text>
  
  <line x1="340" y1="300" x2="240" y2="300" stroke="#71717a" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="240" cy="300" r="32" fill="#27272a" stroke="#a1a1aa" stroke-width="2" />
  <text x="240" y="305" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f4f4f5" text-anchor="middle">DHCP</text>
  
  <line x1="400" y1="360" x2="400" y2="460" stroke="#71717a" stroke-width="2" stroke-dasharray="4,4" />
