  <text x="400" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f4f4f5" text-anchor="middle">WDS</text>
  
  <!-- Text Label -->
  <text x="400" y="530" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#f4f4f5" text-anchor="middle" letter-spacing="1">WINDOWS SERVER 2022 &amp; AD DS</text>
  <text x="400" y="555" font-family="system-ui, sans-serif" font-size="13" fill="#a1a1aa" text-anchor="middle">Contrôleur de Domaine · GPO · WDS Deployment</text>
