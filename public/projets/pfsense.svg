<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)" />
  
  <!-- Outer shield shape -->
  <path d="M 400 120 L 520 180 V 300 C 520 380 400 440 400 440 C 400 440 280 380 280 300 V 180 Z" fill="#27272a" stroke="url(#shieldGrad)" stroke-width="3" />
  
  <!-- Inner lock / security icon -->
  <rect x="365" y="270" width="70" height="50" rx="8" fill="url(#shieldGrad)" />
  <path d="M 380 270 V 240 C 380 225 420 225 420 240 V 270" fill="none" stroke="url(#shieldGrad)" stroke-width="5" stroke-linecap="round" />
  <circle cx="400" cy="292" r="4" fill="#18181b" />
  <path d="M 400 296 V 306" stroke="#18181b" stroke-width="3" stroke-linecap="round" />
  
  <!-- Network badges around -->
  <rect x="140" y="230" width="100" height="36" rx="18" fill="#27272a" stroke="#52525b" stroke-width="1.5" />
  <text x="190" y="253" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f4f4f5" text-anchor="middle">VLAN 10 / 20</text>
  <line x1="240" y1="248" x2="290" y2="248" stroke="#71717a" stroke-width="2" stroke-dasharray="4,4" />

  <rect x="560" y="230" width="100" height="36" rx="18" fill="#27272a" stroke="#52525b" stroke-width="1.5" />
  <text x="610" y="253" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f4f4f5" text-anchor="middle">IPsec VPN</text>
  <line x1="510" y1="248" x2="560" y2="248" stroke="#71717a" stroke-width="2" stroke-dasharray="4,4" />
  
  <!-- Text Label -->
  <text x="400" y="500" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#f4f4f5" text-anchor="middle" letter-spacing="1">PARE-FEU PFSENSE &amp; VPN</text>
  <text x="400" y="525" font-family="system-ui, sans-serif" font-size="13" fill="#a1a1aa" text-anchor="middle">Segmentation VLAN · Règles Firewall · Tunnels VPN Sécurisés</text>
</svg>
